name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Report errors
        if: failure()
        shell: bash
        run: |
          grep -nE "^e: |error:|What went wrong|Could not|Unresolved|Execution failed|FAILED|Exception" build.log | head -40 | while IFS= read -r l; do echo "::error::${l}"; done
          awk '/What went wrong/{f=1} f&&c<25{print;c++}' build.log | while IFS= read -r l; do echo "::error::${l}"; done

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: napominalka-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Кладём готовый APK в ветку apk, чтобы его можно было забрать обычным git
      - name: Publish APK to apk branch
        if: success()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/apk && cp app/build/outputs/apk/debug/app-debug.apk /tmp/apk/napominalka.apk
          cd /tmp/apk
          git init -q && git checkout -q -b apk
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add . && git commit -q -m "APK from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk
